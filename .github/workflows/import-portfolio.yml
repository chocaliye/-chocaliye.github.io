name: Import portfolio snapshot

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-portfolio.yml"

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4

      - name: Clone current portfolio
        run: git clone --depth 1 https://github.com/moxi-edtech/chocaliye-portfolio.git /tmp/source

      - name: Copy portfolio
        run: rsync -a --delete --exclude '.git' --exclude '.github' /tmp/source/ ./

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to migrate."
            exit 0
          fi
          git commit -m "chore: migrate portfolio from moxi-edtech"
          git push
